    <app-navbar></app-navbar>
    <div class="flex-1 flex flex-col items-center justify-center bg-gray-100 px-6 text-center">
  
      <div class="max-w-2xl poppins">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">Bem vindo ao EIMed!</h1>
