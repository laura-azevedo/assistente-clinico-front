<div class="flex">
  <app-navbar></app-navbar>

  <div class="flex-1 flex flex-col">
    <app-header (menuClick)="toggleNavbar()"></app-header>

    <div class="flex-grow flex flex-col items-center justify-center gap-6 overflow-hidden">

      <div class="flex items-center w-full max-w-[860px] px-4">
        <div class="flex-1">
          <app-modal title="3. Exames Complementares"> 
             <div *ngIf="history.length === 0" class="flex flex-col items-center justify-center h-full text-center px-4">
              <p class="text-[#0D334D] text-xl font-semibold">
                Fale pelo microfone ou digite o nome do exame
              </p>
            </div>
            <div *ngFor="let item of history" class="bg-white rounded-lg p-4 shadow mb-4">
              <p class="text-[#0D334D] font-semibold">Exame: {{ item.question }}</p>
              <p class="mt-1">{{ item.answer }}</p>
              <img *ngIf="item.image" [src]="item.image" class="max-w-full rounded" />
            </div>
          </app-modal>
        </div>

        <div class="flex gap-4">
          <app-microphone></app-microphone>

          <button
            *ngIf="enabledButton"
            (click)="openModal()"
            class="bg-[#0D334D] text-white px-4 py-2 rounded text-sm hover:opacity-90"
          >
            Avaliar
          </button>
        </div> 
      </div>

      <div class="flex items-center gap-2 max-w-[700px] w-full px-4">
        <input
          class="flex-1 border rounded px-3 py-2"
          type="text"
          placeholder="Digite o exame que deseja solicitar…"
          [(ngModel)]="examInput"
          (keyup.enter)="submitExamInput()"
        />

        <button 
          class="bg-[#0D334D] text-white px-4 py-2 rounded"
          (click)="submitExamInput()"
        >
          Enviar
        </button>
      </div>

      <app-hipotese
        [isOpen]="isOpened"
        [fase]="'exames-complementares'"
        (closed)="closeModal()"
      ></app-hipotese>

    </div>
  </div>
</div>
