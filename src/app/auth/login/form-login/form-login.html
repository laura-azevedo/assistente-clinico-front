<div class="flex justify-center items-center flex-col w-full lg:col-span-3 gap-3 rounded-lg relative">
    <form class="flex justify-center items-center flex-col w-2/3 gap-3 mt-24">
        <h6 class="poppins text-slate-900 text-2xl">Login</h6>

        <div class="poppins flex flex-col w-full mb-6">
            <label for="usuario" class="sr-only">Usuário (e-mail)</label>
            <input
                type="email"
                id="usuario"
                name="usuario"
                placeholder="Usuário (e-mail)"
                class="border-b border-gray-300 bg-transparent p-2 text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-500"
                name="usuario"
                required
            />
        </div>

        <div class="poppins flex flex-col w-full mb-6">
            <label for="senha" class="sr-only">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                class="border-b border-gray-300 bg-transparent p-2 text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-500"
                name="senha"
                required
            />
        </div>

        <div class="mt-4 w-full">
            <app-botao-login></app-botao-login>
        </div>

    </form>
</div>
