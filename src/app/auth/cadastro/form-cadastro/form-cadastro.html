<div class="flex justify-center items-center flex-col w-full lg:col-span-3 gap-3 rounded-lg relative">
  <div class="absolute top-4 w-2/3 flex justify-end">
  </div>

  <form class="flex justify-center items-center flex-col w-2/3 gap-3 mt-24">
    <h6 class="poppins text-slate-900 text-2xl">Criar conta</h6>

    <div class="poppins flex flex-col w-full mb-6">
      <label for="nome" class="sr-only">Nome</label>
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Nome"
        class="border-b border-gray-300 bg-transparent p-2 text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-500"
        required
      />
    </div>

    <div class="poppins flex flex-col w-full mb-6">
      <label for="usuario" class="sr-only">Usuário (e-mail)</label>
      <input
        type="email"
        id="usuario"
        name="usuario"
        placeholder="Usuário (e-mail)"
        class="border-b border-gray-300 bg-transparent p-2 text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-500"
        required
      />
    </div>

    <div class="poppins flex flex-col w-full mb-6">
      <label for="senha" class="sr-only">Senha</label>
      <input
        type="password"
        id="senha"
        name="senha"
        placeholder="Senha (mínimo 8 caracteres)"
        class="border-b border-gray-300 bg-transparent p-2 text-gray-700 placeholder-gray-400 focus:outline-none focus:border-gray-500"
        required
      />
    </div>

    <div class="poppins flex flex-col w-full mb-6">
        <label for="perfil" class="sr-only">Perfil</label>
        <div class="border-b border-gray-300 bg-transparent p-2 text-gray-700 focus:outline-none focus:border-gray-500">
          <div class="flex gap-4">
            <label class="flex items-center gap-2 text-gray-400">
              <input
                type="radio"
                name="perfil"
                value="professor"
              />
              <span>Professor</span>
            </label>
      
            <label class="flex items-center gap-2 text-gray-400">
              <input
                type="radio"
                name="perfil"
                value="aluno"
              />
              <span>Aluno</span>
            </label>
          </div>
        </div>
      </div>
      
    <div class="mt-4 w-full">
      <app-botao-cadastro></app-botao-cadastro>
    </div>

  </form>
</div>
